configuration:
  device_ip:
    name: "Device IP"
    description: "IP address of the Marstek device (static IP recommended)."
  device_udp_port:
    name: "Device UDP port"
    description: "Open API UDP port set in the Marstek app (default 30000)."
  device_ble_mac:
    name: "Device BLE MAC"
    description: "Leave empty: filled in automatically after the first successful read."
  device_type:
    name: "Device type"
    description: "Leave empty: filled in automatically after the first successful read."
  udp_local_port:
    name: "Local UDP port"
    description: "Local port for answers. 0 = any free port. Set to 30000 if the device always answers to its own port."
  max_power:
    name: "Maximum power"
    description: "Limit for the passive power slider in W (800 or 1200)."
  mqtt_host:
    name: "MQTT host"
    description: "Broker host, e.g. core-mosquitto (or 127.0.0.1)."
  mqtt_port:
    name: "MQTT port"
    description: "Broker port."
  mqtt_username:
    name: "MQTT username"
  mqtt_password:
    name: "MQTT password"
  mqtt_discovery_prefix:
    name: "MQTT discovery prefix"
    description: "Home Assistant discovery prefix."
  mqtt_base_topic:
    name: "MQTT base topic"
    description: "Base topic for states and commands."
  mqtt_suggested_area:
    name: "Suggested area"
    description: "Area suggested for the HA device."
  queue_enabled:
    name: "Request queue"
    description: "ON: send one after another with delay/timeout/retries. OFF: send immediately (fire mode)."
  request_delay:
    name: "Request delay"
    description: "Seconds between two queries (queue mode). Setpoints do not wait for it."
  request_timeout:
    name: "Request timeout"
    description: "Seconds to wait for an answer."
  request_retries:
    name: "Request retries"
    description: "Repetitions of a request without answer (queue mode). Communication goes to FAIL after 3 timeouts in a row."
  dod:
    name: "Depth of discharge"
    description: "DOD in % (30-88). Sent at every start."
  led:
    name: "LED"
    description: "LED on/off. Sent at every start."
  ble_adv:
    name: "Bluetooth advertising"
    description: "Bluetooth advertising on/off. Sent at every start."
  passive_power:
    name: "Passive power"
    description: "W, positive = feed in, negative = charge."
  passive_cd_time:
    name: "Passive countdown"
    description: "Seconds the passive power stays active (cd_time)."
  query_device:
    name: "Enable device info"
    description: "Marstek.GetDevice"
  query_wifi:
    name: "Enable WiFi status"
    description: "Wifi.GetStatus"
  query_ble:
    name: "Enable Bluetooth status"
    description: "BLE.GetStatus"
  query_battery:
    name: "Enable battery status"
    description: "Bat.GetStatus"
  query_pv:
    name: "Enable PV status"
    description: "PV.GetStatus"
  query_es_status:
    name: "Enable energy system status"
    description: "ES.GetStatus"
  query_es_mode:
    name: "Enable energy system mode"
    description: "ES.GetMode"
  lf_enabled:
    name: "Load following"
    description: "Zero export: the setpoint follows the household load measured by the grid sensor."
  lf_sensor_topic:
    name: "Grid sensor topic"
    description: "MQTT topic of the grid meter (plain number in W, positive = import), e.g. Shelly Phase C RAW."
  lf_export_reaction:
    name: "Export reaction"
    description: "On export: setpoint to rest load minus reserve (Rest load) or directly to 0 W."
  lf_window:
    name: "Up window"
    description: "Window in s for regulating up. Peaks shorter than about (100 - percentile) % of it are ignored."
  lf_percentile:
    name: "Up percentile"
    description: "Percentile of the load in the window used for regulating up (30 % = level the load exceeds 70 % of the time)."
  lf_reserve:
    name: "Reserve"
    description: "Target import in W kept below the load."
  lf_deadband:
    name: "Deadband up"
    description: "Regulate up only if the new setpoint is at least this much (W) higher."
  lf_min_power:
    name: "Minimum power"
    description: "Setpoints below this value (W) are sent as 0 W."
  lf_export_small:
    name: "Small export threshold"
    description: "Grid average below this value (W, negative = export) over the small export time -> regulate down."
  lf_export_small_time:
    name: "Small export time"
    description: "Averaging time in s for the small export."
  lf_export_large:
    name: "Large export threshold"
    description: "Two consecutive grid values below this value (W) -> regulate down immediately."
  lf_resend_interval:
    name: "Resend interval"
    description: "The setpoint is re-sent every N s (keeps Passive mode alive and brings the output back after the device switched it off)."
  lf_cd_time:
    name: "Command countdown"
    description: "cd_time of the Passive commands in s. Also the wait time after a failed initialization."
  lf_sensor_timeout:
    name: "Sensor timeout"
    description: "No grid value for N s -> setpoint 0 W."
  log_level:
    name: "Log level"
    description: "trace, debug, info, warning, error"
