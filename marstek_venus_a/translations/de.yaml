configuration:
  device_ip:
    name: "Geräte-IP"
    description: "IP-Adresse des Marstek-Geräts (statische IP empfohlen)."
  device_udp_port:
    name: "UDP-Port des Geräts"
    description: "In der Marstek-App eingestellter Open-API-Port (Standard 30000)."
  device_ble_mac:
    name: "BLE-MAC des Geräts"
    description: "Leer lassen: wird nach dem ersten Auslesen automatisch eingetragen."
  device_type:
    name: "Gerätetyp"
    description: "Leer lassen: wird nach dem ersten Auslesen automatisch eingetragen."
  udp_local_port:
    name: "Lokaler UDP-Port"
    description: "Lokaler Port für Antworten. 0 = beliebiger freier Port. 30000 eintragen, falls das Gerät immer an diesen Port antwortet."
  max_power:
    name: "Maximale Leistung"
    description: "Grenze für den Passive-Leistungs-Slider in W (800 oder 1200)."
  mqtt_host:
    name: "MQTT-Host"
    description: "Broker-Host, z. B. core-mosquitto (oder 127.0.0.1)."
  mqtt_port:
    name: "MQTT-Port"
    description: "Broker-Port."
  mqtt_username:
    name: "MQTT-Benutzer"
  mqtt_password:
    name: "MQTT-Passwort"
  mqtt_discovery_prefix:
    name: "MQTT-Discovery-Präfix"
    description: "Discovery-Präfix von Home Assistant."
  mqtt_base_topic:
    name: "MQTT-Basis-Topic"
    description: "Basis-Topic für Zustände und Befehle."
  mqtt_suggested_area:
    name: "Vorgeschlagener Bereich"
    description: "Vorgeschlagener Bereich für das HA-Gerät."
  queue_enabled:
    name: "Anfrage-Queue"
    description: "EIN: nacheinander mit Delay/Timeout/Retries senden. AUS: sofort senden (Fire-Modus)."
  request_delay:
    name: "Anfrage-Abstand"
    description: "Sekunden zwischen zwei Abfragen (Queue-Modus). Sollwerte warten nicht darauf."
  request_timeout:
    name: "Anfrage-Timeout"
    description: "Sekunden Wartezeit auf eine Antwort."
  request_retries:
    name: "Anfrage-Wiederholungen"
    description: "Wiederholungen einer Anfrage ohne Antwort (Queue-Modus). Communication geht nach 3 Timeouts hintereinander auf FAIL."
  dod:
    name: "Entladetiefe"
    description: "DOD in % (30-88). Wird bei jedem Start gesendet."
  led:
    name: "LED"
    description: "LED ein/aus. Wird bei jedem Start gesendet."
  ble_adv:
    name: "Bluetooth-Advertising"
    description: "Bluetooth-Advertising ein/aus. Wird bei jedem Start gesendet."
  passive_power:
    name: "Passive-Leistung"
    description: "W, positiv = einspeisen, negativ = laden."
  passive_cd_time:
    name: "Passive-Nachlaufzeit"
    description: "Sekunden, die die Passive-Leistung aktiv bleibt (cd_time)."
  query_device:
    name: "Geräteinfo aktiv"
    description: "Marstek.GetDevice"
  query_wifi:
    name: "WLAN-Status aktiv"
    description: "Wifi.GetStatus"
  query_ble:
    name: "Bluetooth-Status aktiv"
    description: "BLE.GetStatus"
  query_battery:
    name: "Batteriestatus aktiv"
    description: "Bat.GetStatus"
  query_pv:
    name: "PV-Status aktiv"
    description: "PV.GetStatus"
  query_es_status:
    name: "Energiesystem-Status aktiv"
    description: "ES.GetStatus"
  query_es_mode:
    name: "Energiesystem-Modus aktiv"
    description: "ES.GetMode"
  lf_enabled:
    name: "Lastfolge"
    description: "Nulleinspeisung: Der Sollwert folgt der vom Netzsensor gemessenen Hauslast."
  lf_sensor_topic:
    name: "Topic Netzsensor"
    description: "MQTT-Topic des Netzzählers (Zahl in W, positiv = Bezug), z. B. Shelly Phase C RAW."
  lf_export_reaction:
    name: "Reaktion auf Einspeisung"
    description: "Bei Einspeisung: Sollwert auf Restlast minus Reserve (Rest load) oder direkt auf 0 W."
  lf_window:
    name: "Fenster Hochregeln"
    description: "Fenster in s für das Hochregeln. Spitzen kürzer als ca. (100 - Perzentil) % davon werden ignoriert."
  lf_percentile:
    name: "Perzentil Hochregeln"
    description: "Perzentil der Last im Fenster für das Hochregeln (30 % = Wert, den die Last 70 % der Zeit überschreitet)."
  lf_reserve:
    name: "Reserve"
    description: "Ziel-Netzbezug in W unterhalb der Last."
  lf_deadband:
    name: "Totzone Hochregeln"
    description: "Nur hochregeln, wenn der neue Sollwert mindestens so viel (W) höher ist."
  lf_min_power:
    name: "Mindestleistung"
    description: "Sollwerte unter diesem Wert (W) werden als 0 W gesendet."
  lf_export_small:
    name: "Schwelle kleine Einspeisung"
    description: "Netz-Mittelwert unter diesem Wert (W, negativ = Einspeisung) über die Zeit kleine Einspeisung -> runterregeln."
  lf_export_small_time:
    name: "Zeit kleine Einspeisung"
    description: "Mittelungszeit in s für die kleine Einspeisung."
  lf_export_large:
    name: "Schwelle große Einspeisung"
    description: "Zwei Netzwerte hintereinander unter diesem Wert (W) -> sofort runterregeln."
  lf_resend_interval:
    name: "Sende-Intervall"
    description: "Der Sollwert wird alle N s erneut gesendet (hält Passive aktiv und holt den Ausgang zurück, wenn das Gerät ihn abgeschaltet hat)."
  lf_cd_time:
    name: "Befehls-Countdown"
    description: "cd_time der Passive-Befehle in s. Auch Wartezeit nach fehlgeschlagener Initialisierung."
  lf_sensor_timeout:
    name: "Sensor-Timeout"
    description: "N s kein Netzwert -> Sollwert 0 W."
  log_level:
    name: "Log-Level"
    description: "trace, debug, info, warning, error"
